name = "monkeledger"
main = "src/index.ts"
compatibility_date = "2026-03-23"
# Friendly public address. workers_dev must stay true: the app and bot call the workers.dev URL,
# and a custom domain turns workers.dev off unless it's set explicitly.
workers_dev = true
routes = [{ pattern = "monkeledger.onlymonkes.app", custom_domain = true }]

# Reverse proxy in front of the MonkeLedger backend (see ../src for that service). Gives the
# backend a real HTTPS URL, Cloudflare's edge as a shock absorber in front of a VPS process that
# is deliberately resource-capped (see ../README.md), and a stable public address independent of
# wherever the backend happens to be hosted.
#
# BACKEND_ORIGIN is the Cloudflare Tunnel `onlymonkes-bot` (ledger.onlymonkes.app → VPS
# 127.0.0.1:3002, set up 2026-10-24). Port 3002 is closed in the VPS firewall, so this is the only
# way in; it used to be http://157-173-192-39.nip.io:3002 straight to the open port.
[vars]
BACKEND_ORIGIN = "https://ledger.onlymonkes.app"
