name = "monkeledger"
main = "src/index.ts"
compatibility_date = "2026-03-23"

# Reverse proxy in front of the MonkeLedger backend (see ../src for that service). Gives the
# backend a real HTTPS URL, Cloudflare's edge as a shock absorber in front of a VPS process that
# is deliberately resource-capped (see ../README.md), and a stable public address independent of
# wherever the backend happens to be hosted.
#
# BACKEND_ORIGIN is a plain var, not a secret, because it's a public IP:port that's already
# openly reachable directly — this Worker doesn't add any confidentiality, just fronting.
#
# Uses nip.io (a free wildcard-DNS service: <ip-with-dashes>.nip.io resolves to that literal IP)
# rather than the bare IP — Cloudflare Workers' fetch() refuses to target a raw IP address
# directly (error 1003), so this needs to look like a hostname even though it resolves to the
# exact same address.
[vars]
BACKEND_ORIGIN = "http://157-173-192-39.nip.io:3002"
